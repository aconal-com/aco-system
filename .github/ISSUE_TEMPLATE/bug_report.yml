name: Bug Report
description: Report something that is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong and what did you expect to happen?
      placeholder: |
        Briefly describe the bug. What were you trying to do? What happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any logs, screenshots, or other context that might help
      placeholder: |
        Add any relevant logs, config, or screenshots here.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      options:
        - Agent (PM, Planner, Architect, Dev, QA, Human)
        - Validation Hook
        - Rules / Security Gate
        - Core (database, event bus, context trimming)
        - Integration (GitHub, LLM)
        - Frontend (Dashboard, Kanban)
        - Documentation
        - Other
    validations:
      required: true
