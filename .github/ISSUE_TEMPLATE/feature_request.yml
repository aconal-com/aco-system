name: Feature Request
description: Suggest a new capability or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for how ACO System could be better? Share it here.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would this feature do and why is it valuable?
      placeholder: |
        Describe the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you considered?
      placeholder: |
        Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, examples, or references?
      placeholder: |
        Add any relevant context here.
    validations:
      required: false
